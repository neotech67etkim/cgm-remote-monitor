<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠팡 판매자 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>쿠팡 판매자 관리</h1>
  <div class="account-picker">
    <label for="account-select">판매자 계정</label>
    <select id="account-select"></select>
    <span id="account-status" class="muted"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="returns">반품 / 취소 요청</button>
  <button class="tab-btn" data-tab="withdrawals">반품철회 이력</button>
  <button class="tab-btn" data-tab="settlement">정산 내역</button>
</nav>

<main>
  <!-- 반품/취소 요청 -->
  <section id="tab-returns" class="tab-panel active">
    <form id="returns-filter" class="filter-bar">
      <label>조회 단위
        <select name="searchType">
          <option value="timeFrame">분단위 (createdAt 범위)</option>
          <option value="daily">일단위</option>
        </select>
      </label>
      <label>시작 <input type="text" name="createdAtFrom" placeholder="2026-07-01T00:00 또는 2026-07-01" required></label>
      <label>종료 <input type="text" name="createdAtTo" placeholder="2026-07-31T23:59 또는 2026-07-31" required></label>
      <label>상태
        <select name="status">
          <option value="">전체</option>
          <option value="RU">RU 출고중지요청</option>
          <option value="UC">UC 반품접수</option>
          <option value="CC">CC 반품완료</option>
          <option value="PR">PR 쿠팡확인요청</option>
        </select>
      </label>
      <label>유형
        <select name="cancelType">
          <option value="RETURN">반품</option>
          <option value="CANCEL">취소</option>
        </select>
      </label>
      <button type="submit">조회</button>
    </form>
    <div id="returns-meta" class="muted"></div>
    <div class="table-wrap">
      <table id="returns-table">
        <thead>
          <tr>
            <th>접수번호</th><th>주문번호</th><th>상태</th><th>접수일시</th>
            <th>신청인</th><th>상품</th><th>수량</th><th>사유</th><th>액션</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button id="returns-more" class="secondary" hidden>다음 페이지</button>
  </section>

  <!-- 반품철회 이력 -->
  <section id="tab-withdrawals" class="tab-panel">
    <h2>기간별 조회 (최대 7일)</h2>
    <form id="withdrawals-date-filter" class="filter-bar">
      <label>시작일 <input type="date" name="dateFrom" required></label>
      <label>종료일 <input type="date" name="dateTo" required></label>
      <label>페이지 <input type="number" name="pageIndex" value="1" min="1"></label>
      <label>페이지당 개수 <input type="number" name="sizePerPage" value="10" min="1" max="100"></label>
      <button type="submit">조회</button>
    </form>
    <div class="table-wrap">
      <table id="withdrawals-date-table">
        <thead><tr><th>취소접수번호</th><th>주문번호</th><th>귀책</th><th>철회시각</th><th>옵션ID</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <h2>접수번호로 조회</h2>
    <form id="withdrawals-id-filter" class="filter-bar">
      <label class="grow">접수번호 (쉼표로 구분, 최대 50개)
        <input type="text" name="cancelIds" placeholder="87033689, 116607450">
      </label>
      <button type="submit">조회</button>
    </form>
    <div class="table-wrap">
      <table id="withdrawals-id-table">
        <thead><tr><th>취소접수번호</th><th>주문번호</th><th>귀책</th><th>철회시각</th><th>옵션ID</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 정산 내역 -->
  <section id="tab-settlement" class="tab-panel">
    <form id="settlement-filter" class="filter-bar">
      <label class="grow">매출인식월 (쉼표로 구분, YYYY-MM)
        <input type="text" name="months" placeholder="2026-07,2026-08" required>
      </label>
      <button type="submit">조회</button>
    </form>
    <div id="settlement-results"></div>
  </section>
</main>

<!-- 상세 모달 -->
<div id="modal-detail" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>닫기</button>
    <h2>반품 상세</h2>
    <pre id="detail-content"></pre>
  </div>
</div>

<!-- 승인처리 모달 -->
<div id="modal-approval" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>닫기</button>
    <h2>반품요청 승인 처리</h2>
    <form id="approval-form">
      <input type="hidden" name="receiptId">
      <label>접수수량(cancelCount) <input type="number" name="cancelCount" min="1" required></label>
      <button type="submit">승인 처리</button>
    </form>
  </div>
</div>

<!-- 회수송장등록 모달 -->
<div id="modal-invoice" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>닫기</button>
    <h2>회수 송장 등록</h2>
    <form id="invoice-form">
      <input type="hidden" name="receiptId">
      <label>유형
        <select name="returnExchangeDeliveryType">
          <option value="RETURN">반품 (RETURN)</option>
          <option value="EXCHANGE">교환 (EXCHANGE)</option>
        </select>
      </label>
      <label>택배사
        <select name="deliveryCompanyCode" id="invoice-courier"></select>
      </label>
      <label>운송장번호 <input type="text" name="invoiceNumber" required></label>
      <label>택배사 회수번호(선택) <input type="text" name="regNumber"></label>
      <button type="submit">등록</button>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
